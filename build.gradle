buildscript {
    ext.kotlin_version = "1.8.0"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:7.4.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

// Comprehensive variables block to completely satisfy the opensdk engine
ext {
    compileSdkVersion = 33
    minSdkVersion = 24
    targetSdkVersion = 33
    versionCode = 1
    versionName = "1.0"
    
    // The specific SDK variables
    masterPkg = "virtual.camera.app"
    localTest = false 
    isMasterPkg = true 
    hackJarName = "hack.jar" 
    assistPkg = "virtual.camera.assist" // <-- Added this missing variable
    
    // Build tools versions
    buildToolsVersion = "33.0.0"
    supportLibraryVersion = "28.0.0"
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
